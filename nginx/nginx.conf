events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream Backend Pool (Layer-7 Load Balancing - Least Connections)
    upstream nexa_backend_cluster {
        least_conn;
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Static Media Offload (0% Node.js CPU overhead via OS sendfile)
        location /public/ {
            alias /app/public/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Reverse Proxy ke Backend Express API
        location / {
            proxy_pass http://nexa_backend_cluster;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP Keep-Alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
